<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>News</title>
 <style>
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 line-height: 1.6;
 color: #333;
 max-width: 800px;
 margin: 0 auto;
 padding: 20px;
 background-color: #f4f4f4;
 }
 .news-item {
 background: #fff;
 margin-bottom: 20px;
 padding: 20px;
 border-radius: 8px;
 box-shadow: 0 2px 5px rgba(0,0,0,0.1);
 }
 .news-image {
 max-width: 100%;
 height: auto;
 border-radius: 4px;
 display: block;
 margin-bottom: 15px;
 }
 .news-date {
 font-size: 0.9em;
 color: #666;
 margin-bottom: 5px;
 }
 .news-caption {
 font-weight: bold;
 font-size: 1.2em;
 }
 </style>
</head>
<body>

 <div class="news-item">
 <img src="images/perlmuttfalter.jpg" alt="Perlmuttfalter" class="news-image">
 <div class="news-date">06. Juni 2026</div>
 <div class="news-caption">Perlmuttfalter gesichtet</div>
 </div>

 <div class="news-item">
 <img src="./images/geier.jpg" alt="Geier" class="news-image">
 <div class="news-date">02. Juni 2026</div>
 <div class="news-caption">Geier</div>
 </div>

</body>
</html>
