<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>News</title>
 <style>
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 line-height: 1.6;
 color: #333;
 max-width: 800px;
 margin: 0 auto;
 padding: 20px;
 background-color: #f4f4f4;
 }
 h1 { text-align: center; color: #2c3e50; }
 .news-item {
 background: #fff;
 margin-bottom: 20px;
 padding: 15px;
 border-radius: 8px;
 box-shadow: 0 2px 5px rgba(0,0,0,0.1);
 }
 .news-image {
 width: 100%;
 height: auto;
 border-radius: 4px;
 }
 .news-date {
 font-size: 0.9em;
 color: #7f8c8d;
 margin-top: 10px;
 }
 .news-caption {
 font-weight: bold;
 margin-top: 5px;
 }
 </style>
</head>
<body>
 <h1>News</h1>

 <div class="news-item">
 <img src="./images/garten.jpg" alt="Garten" class="news-image">
 <div class="news-date">03. Juni 2026</div>
 <div class="news-caption">Garten</div>
 </div>

 <div class="news-item">
 <img src="./images/falter.jpg" alt="Falter" class="news-image">
 <div class="news-date">02. Juni 2026</div>
 <div class="news-caption">Falter</div>
 </div>

 <div class="news-item">
 <img src="./images/geier.jpg" alt="Geier" class="news-image">
 <div class="news-date">02. Juni 2026</div>
 <div class="news-caption">Geier</div>
 </div>
</body>
</html>
