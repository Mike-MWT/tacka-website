<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>News</title>
 <style>
 body {
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 margin: 0;
 padding: 20px;
 background-color: #f5f5f5;
 }
 h1 {
 text-align: center;
 color: #2c3e50;
 }
 .news-container {
 max-width: 1200px;
 margin: 0 auto;
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
 gap: 20px;
 }
 .news-item {
 background: white;
 border-radius: 8px;
 overflow: hidden;
 box-shadow: 0 2px 8px rgba(0,0,0,0.1);
 transition: transform 0.2s;
 }
 .news-item:hover {
 transform: translateY(-2px);
 }
 .news-image {
 width: 100%;
 height: 250px;
 object-fit: cover;
 }
 .news-content {
 padding: 16px;
 }
 .news-date {
 color: #666;
 font-style: italic;
 font-size: 0.9em;
 margin-bottom: 8px;
 }
 .news-caption {
 font-weight: bold;
 font-size: 1.1em;
 color: #333;
 }
 </style>
</head>
<body>
 <h1>Aktuelle News</h1>
 <div class="news-container">
 
 <div class="news-item">
 <img src="images/01obelisk.jpg" alt="Obelisk" class="news-image">
 <div class="news-content">
 <div class="news-date">25. Mai 2026</div>
 <div class="news-caption">Obelisk</div>
 </div>
 </div>
 
 <div class="news-item">
 <img src="images/02LaBoca.jpg" alt="LaBoca" class="news-image">
 <div class="news-content">
 <div class="news-date">25. Mai 2026</div>
 <div class="news-caption">LaBoca</div>
 </div>
 </div>
 
 <div class="news-item">
 <img src="images/03MoteH.jpg" alt="MoteH" class="news-image">
 <div class="news-content">
 <div class="news-date">25. Mai 2026</div>
 <div class="news-caption">MoteH</div>
 </div>
 </div>
 
 <div class="news-item">
 <img src="images/geier.jpg" alt="Geier" class="news-image">
 <div class="news-content">
 <div class="news-date">01. Juni 2026</div>
 <div class="news-caption">Geier</div>
 </div>
 </div>
 
 <div class="news-item">
 <img src="images/perlmuttfalter.jpg" alt="Perlmuttfalter" class="news-image">
 <div class="news-content">
 <div class="news-date">02. Juni 2026</div>
 <div class="news-caption">Perlmuttfalter</div>
 </div>
 </div>

 </div>
</body>
</html>
