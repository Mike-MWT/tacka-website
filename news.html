<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>News</title>
 <style>
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 line-height: 1.6;
 color: #333;
 max-width: 800px;
 margin: 0 auto;
 padding: 20px;
 background-color: #f4f4f4;
 text-align: center;
 }
 .news-item {
 margin-bottom: 40px;
 text-align: center;
 }
 .news-image {
 max-width: 100%;
 height: auto;
 display: block;
 margin: 0 auto;
 border-radius: 8px;
 box-shadow: 0 4px 8px rgba(0,0,0,0.1);
 }
 .news-date {
 font-size: 0.9em;
 color: #666;
 margin-top: 10px;
 }
 .news-caption {
 font-size: 1.1em;
 font-weight: bold;
 margin-top: 5px;
 }
 </style>
</head>
<body>

 <div class="news-item">
 <img src="./images/garten.jpg" alt="Garten" class="news-image">
  <div class="news-date">25. Mai 2026</div>
 <div class="news-caption">Garten</div>
 </div>

 <div class="news-item">
 <img src="./images/gulf_fritillary.jpg" alt="Großer Perlmuttfalter" class="news-image">
 <div class="news-date">31. Mai 2026</div>
 <div class="news-caption">Großer Perlmuttfalter (Gulf fritillary)</div>
 </div>

 <div class="news-item">
 <img src="./images/geier.jpg" alt="Geier" class="news-image">
 <div class="news-date">6. Juni 2026</div>
 <div class="news-caption">Geier</div>
 </div>

</body>
</html>
